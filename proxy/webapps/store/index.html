<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Webapp Store</title>
<style>
:root{--bg:#F1F3F7;--panel:#fff;--ink:#1B2433;--mute:#5B6678;--line:#D5DAE3;--accent:#0F7B7D;--on-accent:#fff;--gl:38%}
@media (prefers-color-scheme:dark){:root{--bg:#151A23;--panel:#1E2430;--ink:#E7EAF0;--mute:#9AA5B8;--line:#2E3647;--accent:#4CC3C5;--on-accent:#0B1418;--gl:42%}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Noto Sans",system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:40px 20px 64px}
header{display:flex;flex-wrap:wrap;gap:16px;align-items:end;justify-content:space-between;margin-bottom:20px}
h1{margin:0;font:700 2.2rem/1.1 "Noto Serif",Georgia,serif}
.sub{margin:4px 0 0;color:var(--mute)}
input{width:260px;max-width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
nav{display:flex;flex-wrap:wrap;gap:4px 20px;border-bottom:1px solid var(--line);margin-bottom:20px}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:8px 0;color:var(--mute);font:inherit;cursor:pointer}
.tab[aria-pressed=true]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
ul{list-style:none;margin:0;padding:0;display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:760px){ul{grid-template-columns:1fr 1fr}}
.app{display:grid;grid-template-columns:56px 1fr auto;gap:16px;align-items:center;padding:16px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.glyph{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;color:#fff;font:700 1.6rem "Noto Serif",Georgia,serif;background:hsl(var(--h) 55% var(--gl))}
h2{margin:0;font-size:1.05rem}
.app p{margin:2px 0 4px;color:var(--mute);font-size:.92rem}
small{color:var(--mute)}
.btn{padding:8px 18px;border-radius:8px;background:var(--accent);color:var(--on-accent);text-decoration:none;font-weight:600}
.miss{max-width:150px;font-size:.78rem;color:var(--mute);text-align:right}
.empty{grid-column:1/-1;padding:32px;text-align:center;color:var(--mute)}
</style>
</head>
<body>
<main>
  <header>
    <div><h1>Webapp Store</h1><p class="sub">Your websites, one click away.</p></div>
    <input id="q" type="search" placeholder="Search your apps" aria-label="Search apps">
  </header>
  <nav id="cats" aria-label="Categories"></nav>
  <ul id="list"></ul>
</main>
<script>
/* ADD AN APP: add a line below. Local apps live in webapps/<id>/index.html and open at
   http://<id>.app.local/ . For an outside site, add  url:"https://..."  instead. */
const APPS=[
 {id:"studyhub",name:"StudyHub",desc:"Flashcards, focus timer, homework tracker, math and vocabulary practice.",cat:"Learning",hue:200},
 {id:"chhamiya",name:"Chhamiya Collective",desc:"Jewelry storefront with an admin dashboard.",cat:"Shopping",hue:330},
 {id:"portal",name:"Windows Portal",desc:"Windows 11-style start page with wallpapers, widgets and favorites.",cat:"Desktop",hue:215},
 {id:"myos",name:"MyOS",desc:"A desktop that runs in the browser, with built-in apps and games.",cat:"Desktop",hue:260},
 {id:"websearch",name:"Web Search",desc:"A standalone search page.",cat:"Tools",hue:170},
 {id:"games",name:"Offline Games",desc:"30 games that work without internet.",cat:"Games",hue:20},
 {id:"m365",name:"Microsoft 365 Links",desc:"Every Microsoft 365 web app on one page.",cat:"Tools",hue:150},
 {id:"pjc-chat",name:"PJC Chat",desc:"Direct and group messages for the PJC friend group.",cat:"Social",hue:285}
];
let installed=null,cat="All",q="";
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function render(){
  const cats=["All",...new Set(APPS.map(a=>a.cat))];
  $("#cats").innerHTML=cats.map(c=>`<button class="tab" data-c="${c}" aria-pressed="${c===cat}">${c}</button>`).join("");
  const list=APPS.filter(a=>(cat==="All"||a.cat===cat)&&(a.name+" "+a.desc+" "+a.cat).toLowerCase().includes(q));
  $("#list").innerHTML=list.length?list.map(a=>{
    const href=a.url||`http://${a.id}.app.local/`;
    const on=a.url||installed===null||installed.includes(a.id);
    const act=on?`<a class="btn" href="${href}" target="_blank" rel="noopener">Open</a>`
                :`<span class="miss">Not installed. Add index.html to webapps/${a.id}/</span>`;
    return `<li class="app"><span class="glyph" style="--h:${a.hue}" aria-hidden="true">${a.name[0]}</span><div><h2>${a.name}</h2><p>${a.desc}</p><small>${a.cat}</small></div>${act}</li>`;
  }).join(""):`<li class="empty">No apps match "${esc(q)}". Try another word or pick All.</li>`;
}
$("#cats").onclick=e=>{if(e.target.dataset.c){cat=e.target.dataset.c;render()}};
$("#q").oninput=e=>{q=e.target.value.trim().toLowerCase();render()};
render();
fetch("/_apps").then(r=>r.json()).then(l=>{installed=l;render()}).catch(()=>{});
</script>
</body>
</html>
