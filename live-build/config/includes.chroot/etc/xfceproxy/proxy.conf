[proxy]
listen = 127.0.0.1
port = 8080
log = /var/log/xfceproxy/proxy.log

[webapps]
dir = /usr/share/xfceproxy/webapps
domain = app.local
default = home

[filter]
; comma-separated host patterns to block, e.g. *.ads.example, tracker.*
block =

[upstreams]
; map a webapp name to a local backend, e.g.
; notes = 127.0.0.1:5000

[edu]
; EDU Mode can only reach these sites (plus local webapps). Add more patterns here, comma separated.
allow = scratch.mit.edu, *.scratch.mit.edu, pbskids.org, *.pbskids.org, *.pbs.org, khanacademy.org, *.khanacademy.org, *.kastatic.org, code.org, *.code.org, kids.nationalgeographic.com, *.nationalgeographic.com, wikipedia.org, *.wikipedia.org, *.wikimedia.org
